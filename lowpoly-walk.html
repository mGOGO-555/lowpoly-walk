<body>
<div id="panel">
  <b>Lowpoly Walk</b><br>
  Quest のブラウザで開いて「ENTER VR」。その場で足踏みすると、見ている方向へ進みます。<br>
  VR: <kbd>グリップ(握るボタン)</kbd> で季節・地形を切り替え<br>
  PC確認: <kbd>W</kbd> 前進 / ドラッグで視点 / <kbd>T</kbd> テーマ切替 / <kbd>[</kbd> <kbd>]</kbd> 速度 / <kbd>H</kbd> パネル表示<br>
  <kbd>N</kbd> 歩行者 / <kbd>E</kbd> 落とし物・穴 の ON/OFF<br>
  URL指定: <kbd>?theme=winter&amp;seed=7&amp;npc=0&amp;events=0</kbd>
  <div id="themes"></div>
  <div id="toggles"><button id="tgNpc"></button><button id="tgEvt"></button></div>
  <div id="status"></div>
</div>

<script type="importmap">
{

  }

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ========== 調整用パラメータ ========== */
const STEP_THRESHOLD = 0.12;  // 足踏み判定のしきい値 (頭の上下速度 m/s)。小さいほど敏感
const STEP_GAIN      = 12;    // 足踏みの強さ → 移動速度への倍率
const MAX_SPEED      = 4.5;   // 最大移動速度 (m/s)
const CHUNK          = 40;    // 地形チャンクの大きさ (m)
const SEG            = 24;    // チャンク分割数 (大きいほど地面がなめらか)
const RADIUS         = 2;     // プレイヤー周囲に読み込むチャンク数
const GRASS_SCALE    = 1.0;   // 草の量 (重い場合は 0.5 などに下げる。0 で草なし)

/* ========== テーマ(季節・地形)の定義 ========== */
const THEMES = {
  autumn: {
    label: '秋', shape: 'tree',
    skyTop: 0x5f79aa, skyHorizon: 0xecc9a4, sunColor: 0xffc48a, sunDir: [-0.55, 0.30, -0.78], cloud: 0xf3d9c4,
    fog: [35, 110], hemi: [0xbcc8e6, 0x6b5540, 1.5], sun: [0xffc890, 3.4],
    terrain: { freq: 0.012, amp: 30, off: 0.35, detail: 2 },
    ground: { path: 0x7b6650, low: 0x6f7a3a, mid: 0x88763a, high: 0x9a8a70, alt: 0x9c6428, rock: 0x6f675e, h1: 5, h2: 11 },
    trunk: 0x6a5240, trees: 16, pineRatio: 0.5, rocks: 6,
    pine: [0x3d6048, 0x466e50, 0x35533f],
    leaf: [0xe0902f, 0xc8541f, 0xe8b040, 0xb03c20, 0xc98530],
    grass: { n: 700, colors: [0xb0a040, 0xa88434, 0x90a040, 0xc09a40] },
    flowers: null,
    particles: { color: 0xe07a2a, size: 0.22, fall: 1.0, drift: 1.2, count: 260 },
  },
  spring: {
    label: '春', shape: 'tree',
    skyTop: 0x4f95dc, skyHorizon: 0xdcecf5, sunColor: 0xfff2d8, sunDir: [-0.4, 0.6, -0.6], cloud: 0xffffff,
    fog: [45, 120], hemi: [0xd8ecff, 0x7a9a5a, 1.6], sun: [0xfff2d0, 3.2],
    terrain: { freq: 0.011, amp: 24, off: 0.35, detail: 2 },
    ground: { path: 0xa08a68, low: 0x6fa040, mid: 0x86b452, high: 0xa8b58a, alt: 0xa8c860, rock: 0x8a8580, h1: 5, h2: 10 },
    trunk: 0x7a5a48, trees: 16, pineRatio: 0.3, rocks: 5,
    pine: [0x5a9a52, 0x66a85a, 0x4c8c48],
    leaf: [0xf7b6cc, 0xf9cddb, 0xee9dbb, 0xffe0ea],
    grass: { n: 800, colors: [0x7cb048, 0x8cc050, 0x6ea040, 0x9ccc58] },
    flowers: { n: 140, colors: [0xffffff, 0xffe066, 0xf7a6c4, 0xc8a8f0] },
    particles: { color: 0xffc2d6, size: 0.2, fall: 0.8, drift: 1.4, count: 260 },
  },
  summer: {
    label: '夏', shape: 'tree',
    skyTop: 0x2c7bd8, skyHorizon: 0xbfdcf0, sunColor: 0xfff6e0, sunDir: [-0.3, 0.85, -0.4], cloud: 0xffffff,
    fog: [50, 130], hemi: [0xcfe6ff, 0x5a7a3a, 1.7], sun: [0xfff4d6, 3.8],
    terrain: { freq: 0.012, amp: 26, off: 0.35, detail: 2 },
    ground: { path: 0x9a8462, low: 0x4a8a34, mid: 0x5c9a3c, high: 0x8a9070, alt: 0x3c7a2c, rock: 0x807b72, h1: 6, h2: 12 },
    trunk: 0x6a5240, trees: 18, pineRatio: 0.4, rocks: 5,
    pine: [0x2c7a44, 0x358852, 0x2a7040],
    leaf: [0x4a9e3c, 0x5cb048, 0x3a8c3a, 0x6cc058],
    grass: { n: 900, colors: [0x6cb04a, 0x7cc050, 0x5ca040, 0x88c458] },
    flowers: { n: 90, colors: [0xffffff, 0xffe45c, 0xd888e8] },
    particles: null,
  },
  winter: {
    label: '冬', shape: 'tree',
    skyTop: 0x7c9cc0, skyHorizon: 0xdfe8ef, sunColor: 0xf0f4ff, sunDir: [-0.5, 0.3, -0.8], cloud: 0xe4eaf0,
    fog: [25, 95], hemi: [0xdde8f5, 0x8090a0, 1.8], sun: [0xe8f0ff, 2.6],
    terrain: { freq: 0.010, amp: 42, off: 0.35, detail: 2 },
    ground: { path: 0xa9aeb2, low: 0xe6edf2, mid: 0xdfe7ee, high: 0xf5f8fb, alt: 0xc8d4de, rock: 0x8f969c, h1: 8, h2: 16 },
    trunk: 0x5a4a42, trees: 14, pineRatio: 0.85, rocks: 8,
    pine: [0xb4ccc4, 0x9ab8ae, 0xd0e2de],
    leaf: [0xe4ecf2, 0xd0dae2],
    grass: { n: 150, colors: [0xd8d8b8, 0xc8c8a8] },
    flowers: null,
    particles: { color: 0xffffff, size: 0.16, fall: 1.6, drift: 0.6, count: 400 },
  },
  desert: {
    label: '砂漠', shape: 'desert',
    skyTop: 0x4a90d0, skyHorizon: 0xf2d9a6, sunColor: 0xfff0c8, sunDir: [-0.2, 0.8, -0.5], cloud: 0xf8ecd4,
    fog: [40, 115], hemi: [0xffefd0, 0xb08a50, 1.6], sun: [0xfff0c0, 3.8],
    terrain: { freq: 0.008, amp: 16, off: 0.4, detail: 1 },
    ground: { path: 0xa88555, low: 0xd8b070, mid: 0xe2bb78, high: 0xc4975a, alt: 0xc9a060, rock: 0x9a7a55, h1: 3, h2: 8 },
    trunk: 0x6a5240, trees: 10, pineRatio: 1, rocks: 16,
    pine: [0x6f9a58, 0x7fa862],          // サボテン
    leaf: [],
    grass: { n: 140, colors: [0xb8a060, 0xa89050] },
    flowers: null,
    particles: null,
  },
};
const THEME_KEYS = Object.keys(THEMES);

const params = new URLSearchParams(location.search);
const seed = parseInt(params.get('seed') ?? '42', 10) || 42;
let themeKey = THEMES[params.get('theme')] ? params.get('theme') : 'autumn';
let TH = THEMES[themeKey];
let speedMult = 1;
let npcOn = params.get('npc') !== '0';        // 歩行者
let eventsOn = params.get('events') !== '0';  // 落とし物・穴・水たまり
const SLOT = 22;                               // 道の上の出来事の間隔 (m)

/* ========== 乱数・ノイズ (シード対応) ========== */
function hash2(ix, iz) {
  let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263) ^ Math.imul(seed, 1013904223);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const smooth = t => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = x => Math.min(1, Math.max(0, x));
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = smooth(x - ix), fz = smooth(z - iz);
  return lerp(
    lerp(hash2(ix, iz), hash2(ix + 1, iz), fx),
    lerp(hash2(ix, iz + 1), hash2(ix + 1, iz + 1), fx),
    fz
  );
}
function fbm(x, z, oct = 4) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { v += a * vnoise(x * f, z * f); f *= 2; a *= 0.5; }
  return v;
}
const smoothstep = (a, b, x) => smooth(clamp01((x - a) / (b - a)));
// 位置から決まる擬似乱数 (-0.5〜0.5)。形の凸凹づけに使う
const fr = x => x - Math.floor(x);
const jit = (x, y, z, k) => fr(Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + k * 4.1) * 43758.5453) - 0.5;

/* ========== 地形の高さ関数 (テーマごとに起伏が変わる) ========== */
const pathX = z => Math.sin(z * 0.03 + seed) * 18 + Math.sin(z * 0.008 + seed * 0.3) * 34 + Math.sin(z * 0.075 + seed * 2.1) * 4;
function heightAt(x, z) {
  const T = TH.terrain;
  const hill = (fbm(x * T.freq, z * T.freq) - T.off) * T.amp + fbm(x * 0.06, z * 0.06, 2) * T.detail;
  const pathH = fbm(z * 0.01 + 100, 7.7, 3) * 6;
  const t = smoothstep(2.5, 9, Math.abs(x - pathX(z)));
  return lerp(pathH, hill, t);
}

/* ========== シーン ========== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9a8aa8);
scene.fog = new THREE.Fog(0x9a8aa8, 40, 105);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);
camera.rotation.order = 'YXZ';
const dolly = new THREE.Group();   // XR空間ではこのグループを動かして移動する
dolly.add(camera);
scene.add(dolly);
camera.position.set(0, 1.6, 0);
dolly.position.set(pathX(0), heightAt(pathX(0), 0), 0);  // 道の上からスタート

const hemi = new THREE.HemisphereLight(0xffffff, 0x888888, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3);
scene.add(sun);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.xr.enabled = true;
renderer.xr.setFoveation?.(1);
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

/* ========== 空(グラデーション + 太陽のにじみ) ========== */
const skyUniforms = {
  top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() },
  sunColor: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3(0, 1, 0) },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `
    varying vec3 vDir;
    void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 horizon; uniform vec3 sunColor; uniform vec3 sunDir;
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      float h = clamp(d.y, 0.0, 1.0);
      vec3 col = mix(horizon, top, pow(h, 0.5));
      float s = max(dot(d, normalize(sunDir)), 0.0);
      col += sunColor * (pow(s, 900.0) * 2.5 + pow(s, 24.0) * 0.35 + pow(s, 4.0) * 0.10);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), skyMat);
skyDome.renderOrder = -10;
skyDome.frustumCulled = false;
dolly.add(skyDome);

/* ========== テクスチャ (canvasで生成) ========== */
function radialTexture(size, stops) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const shadowTex = radialTexture(64, [[0, 'rgba(0,0,0,0.6)'], [0.55, 'rgba(0,0,0,0.3)'], [1, 'rgba(0,0,0,0)']]);
const dotTex = radialTexture(32, [[0, 'rgba(255,255,255,1)'], [0.5, 'rgba(255,255,255,0.7)'], [1, 'rgba(255,255,255,0)']]);
const cloudTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const r = mulberry32(5);
  for (let i = 0; i < 16; i++) {
    const x = 128 + (r() - 0.5) * 120, y = 128 + (r() - 0.5) * 50, rad = 38 + r() * 46;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(255,255,255,0.36)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

function blobPath(g, cx, cy, base, wobble, sx, sy, r, scale) {
  const pts = 22;
  g.beginPath();
  for (let i = 0; i <= pts; i++) {
    const a = (i % pts) / pts * Math.PI * 2, rad = (base + Math.sin(i * 12.9 + wobble) * 0.05 + (r[i % pts] - 0.5) * 0.06) * scale;
    const x = cx + Math.cos(a) * rad * sx, y = cy + Math.sin(a) * rad * sy;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
}
const potholeTex = (() => {          // 道の穴 (縁の土 + 暗い中心)
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), rr = mulberry32(11), r = Array.from({ length: 22 }, rr);
  g.fillStyle = 'rgba(80,60,44,0.55)'; blobPath(g, 64, 64, 0.40, 1, S, S, r, 1.22); g.fill();
  const gr = g.createRadialGradient(60, 58, 4, 64, 64, 50);
  gr.addColorStop(0, '#040302'); gr.addColorStop(0.7, '#17110c'); gr.addColorStop(1, '#2b2018');
  g.fillStyle = gr; blobPath(g, 64, 64, 0.40, 1, S, S, r, 1.0); g.fill();
  g.strokeStyle = 'rgba(150,120,88,0.5)'; g.lineWidth = 3; blobPath(g, 64, 64, 0.40, 1, S, S, r, 1.0); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const puddleTex = (() => {           // 水たまり (色は空の色でテーマごとに変わる)
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), rr = mulberry32(23), r = Array.from({ length: 22 }, rr);
  g.fillStyle = 'rgba(150,158,170,0.9)'; blobPath(g, 64, 64, 0.42, 2, S, S, r, 1.0); g.fill();
  g.strokeStyle = 'rgba(90,90,90,0.55)'; g.lineWidth = 3; blobPath(g, 64, 64, 0.42, 2, S, S, r, 1.0); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.ellipse(46, 50, 20, 7, -0.3, 0, Math.PI * 2); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

/* ========== 形状づくり(なめらか + 凸凹 + 上ほど明るい頂点色) ========== */
const _v = new THREE.Vector3();
function prep(g) {                       // UV・法線を捨てて頂点を溶接 → なめらかな陰影にできる
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  return mergeVertices(g, 1e-4);
}
function paint(g, fn) {                  // 頂点ごとの明るさ(疑似的な陰影)を焼き込む
  const p = g.attributes.position, col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const b = fn(p.getX(i), p.getY(i), p.getZ(i), i);
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
}
function makeBlob(r, x, y, z, sx, sy, sz, k, detail = 2) {
  const g = prep(new THREE.IcosahedronGeometry(r, detail));
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    _v.fromBufferAttribute(p, i);
    _v.multiplyScalar(1 + jit(_v.x, _v.y, _v.z, k) * 0.3);
    p.setXYZ(i, _v.x * sx + x, _v.y * sy + y, _v.z * sz + z);
  }
  return g;
}

// 広葉樹: 複数のこんもりした塊
const leafGeo = (() => {
  const g = mergeGeometries([
    makeBlob(1.9, 0, 4.5, 0, 1, 0.85, 1, 1),
    makeBlob(1.4, 1.1, 3.7, 0.5, 1, 0.9, 1, 2),
    makeBlob(1.35, -1.0, 3.8, -0.6, 1, 0.9, 1, 3),
    makeBlob(1.2, 0.1, 5.6, -0.4, 1, 0.9, 1, 4),
  ]);
  paint(g, (x, y, z) => lerp(0.66, 1.0, clamp01((y - 2.5) / 3.6)) * (0.88 + 0.24 * (jit(x * 3, y * 3, z * 3, 9) + 0.5)));
  g.computeVertexNormals();
  return g;
})();

// 針葉樹: 重なった段 (下の段ほど暗く、段の先端ほど明るい)
const pineGeo = (() => {
  const parts = [];
  for (let i = 0; i < 4; i++) {
    const r = 2.0 - i * 0.42, h = 2.3 - i * 0.2, y0 = 1.3 + i * 1.15;
    const g = prep(new THREE.ConeGeometry(r, h, 9, 1, false));
    g.translate(0, y0 + h / 2, 0);
    const p = g.attributes.position;
    for (let n = 0; n < p.count; n++) {
      _v.fromBufferAttribute(p, n);
      const f = 1 + jit(_v.x, _v.y, _v.z, i) * 0.25;
      p.setXYZ(n, _v.x * f, _v.y + jit(_v.x, _v.y, _v.z, 7 + i) * 0.18, _v.z * f);
    }
    paint(g, (x, y) => (0.62 + 0.38 * clamp01((y - y0) / h)) * (0.84 + 0.16 * (i / 3)));
    parts.push(g);
  }
  const g = mergeGeometries(parts);
  g.computeVertexNormals();
  return g;
})();

// 幹
const trunkGeo = (() => {
  const g = prep(new THREE.CylinderGeometry(0.14, 0.32, 3.4, 7, 3));
  g.translate(0, 1.7, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    _v.fromBufferAttribute(p, i);
    p.setXYZ(i, _v.x + jit(_v.x, _v.y, _v.z, 3) * 0.08, _v.y, _v.z + jit(_v.x, _v.y, _v.z, 4) * 0.08);
  }
  paint(g, (x, y) => lerp(0.62, 1.0, clamp01(y / 3.0)));
  g.computeVertexNormals();
  return g;
})();

// サボテン
const cactusGeo = (() => {
  const cyl = (r1, r2, h) => new THREE.CylinderGeometry(r1, r2, h, 8, 1);
  const parts = [
    cyl(0.4, 0.5, 4.5).translate(0, 2.25, 0),
    cyl(0.22, 0.25, 1.4).rotateZ(Math.PI / 2).translate(-0.9, 2.6, 0),
    cyl(0.2, 0.22, 1.3).translate(-1.55, 3.2, 0),
    cyl(0.22, 0.25, 1.4).rotateZ(Math.PI / 2).translate(0.9, 1.8, 0),
    cyl(0.2, 0.22, 1.3).translate(1.55, 2.4, 0),
  ].map(prep);
  const g = mergeGeometries(parts);
  paint(g, (x, y) => lerp(0.6, 1.0, clamp01(y / 4)) * (0.92 + 0.16 * (jit(x * 5, y * 5, 0, 2) + 0.5)));
  g.computeVertexNormals();
  return g;
})();

// 岩 (角ばった質感を残す)
const rockGeo = (() => {
  const g = prep(new THREE.IcosahedronGeometry(1, 1));
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    _v.fromBufferAttribute(p, i);
    _v.multiplyScalar(1 + jit(_v.x, _v.y, _v.z, 5) * 0.7);
    p.setXYZ(i, _v.x * 1.3, _v.y * 0.75 + 0.25, _v.z);

})();

// 草の束 (根元が暗く先が明るい)
const grassGeo = (() => {

    const ca = Math.cos(a), sa = Math.sin(a), cl = Math.cos(a + 1.9) * lean, sl = Math.sin(a + 1.9) * lean;
    pos.push(ca * w, 0, sa * w, -ca * w, 0, -sa * w, cl, h, sl);

const potholeGeoFlat = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);

// --- 落とし物 (色を頂点に焼き込む。原点は底面の中心) ---
function cgeo(g, hex, br = 1) {
  g.deleteAttribute('uv');
  const c = new THREE.Color(hex).multiplyScalar(br), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g.index ? g.toNonIndexed() : g;
}
const itemGeos = {

    cgeo(new THREE.BoxGeometry(0.26, 0.2, 0.08).translate(0, 0.16, 0.14), 0xffffff, 0.75),
    cgeo(new THREE.BoxGeometry(0.1, 0.04, 0.03).translate(0, 0.48, 0), 0xffffff, 0.4),

  wallet: mergeGeometries([                    // 財布
    cgeo(new THREE.BoxGeometry(0.22, 0.03, 0.14).translate(0, 0.015, 0), 0xffffff),
    cgeo(new THREE.BoxGeometry(0.1, 0.005, 0.06).translate(0.06, 0.032, 0.03), 0xe8e8e8),

};
const ITEM_COLS = {

  wallet: [0x4a3020, 0x202020, 0x8a2a2a].map(c => new THREE.Color(c)),

/* ========== マテリアル ========== */
const trunkMat   = new THREE.MeshLambertMaterial({ vertexColors: true, color: 0x6a5240 });
const foliageMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const rockMat    = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const grassMat   = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
const flowerMat  = new THREE.MeshLambertMaterial({ flatShading: true });
const terrainMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const shadowMat  = new THREE.MeshBasicMaterial({
  map: shadowTex, transparent: true, depthWrite: false,
  polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,

const itemMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const decalOpts = { transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 };
const potholeMat = new THREE.MeshBasicMaterial({ map: potholeTex, ...decalOpts });
const puddleMat  = new THREE.MeshBasicMaterial({ map: puddleTex, ...decalOpts, opacity: 0.9 });

/* ========== チャンク生成 ========== */
const chunks = new Map();
const queue = [];
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();
const cHigh = new THREE.Color(), cMid = new THREE.Color(), cLow = new THREE.Color();
const cAlt = new THREE.Color(), cRock = new THREE.Color(), cPath = new THREE.Color();
const _gn = new THREE.Vector3();
const _q = new THREE.Quaternion();
const UP = new THREE.Vector3(0, 1, 0);

function groundColor(x, z, h, ny, out) {
  const G = TH.ground;
  if (h > G.h2) out.copy(cHigh);
  else if (h > G.h1) out.copy(cMid).lerp(cHigh, (h - G.h1) / (G.h2 - G.h1));
  else out.copy(cLow).lerp(cMid, clamp01(h / G.h1));
  out.lerp(cAlt, smoothstep(0.45, 0.7, fbm(x * 0.05 + 50, z * 0.05 + 50, 2)) * 0.8);   // 地面のまだら模様
  out.multiplyScalar(0.88 + 0.24 * hash2(Math.floor(x * 1.7), Math.floor(z * 1.7)));  // 細かなざらつき
  out.lerp(cRock, smoothstep(0.86, 0.66, ny));                                         // 急斜面は岩肌
  const d = Math.abs(x - pathX(z)) + (fbm(x * 0.4, z * 0.4, 2) - 0.5) * 1.8;           // 道 (縁をゆらす)
  out.lerp(cPath, 1 - smoothstep(2.4, 3.9, d));
}

function instanced(geo, mat, items, colors) {
  const m = new THREE.InstancedMesh(geo, mat, Math.max(1, items.length));
  m.count = items.length;
  for (let i = 0; i < items.length; i++) {
    const t = items[i];
    dummy.position.set(t.x, t.y, t.z);
    if (t.q) dummy.quaternion.copy(t.q); else dummy.rotation.set(t.rx || 0, t.ry, t.rz || 0);
    dummy.scale.set(t.sx ?? t.s, t.sy ?? t.s, t.sz ?? t.s);
    dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix);
    if (colors && colors.length) m.setColorAt(i, colors[Math.floor(t.ci * colors.length)]);
  }
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  return m;
}

function buildChunk(cx, cz) {
  const group = new THREE.Group();
  const ox = cx * CHUNK, oz = cz * CHUNK, G = TH.ground;
  cHigh.set(G.high); cMid.set(G.mid); cLow.set(G.low); cAlt.set(G.alt); cRock.set(G.rock); cPath.set(G.path);

  // --- 高さの格子 (周囲1マス分を含める = 隣のチャンクとつなぎ目なし) ---
  const N = SEG + 1, M = SEG + 3, cs = CHUNK / SEG;
  const H = new Float32Array(M * M);
  for (let i = -1; i <= SEG + 1; i++)
    for (let j = -1; j <= SEG + 1; j++) H[(i + 1) * M + (j + 1)] = heightAt(ox + i * cs, oz + j * cs);
  const hAt = (i, j) => H[(i + 1) * M + (j + 1)];

  // --- 地形メッシュ (なめらかな法線 + 頂点色) ---
  const pos = new Float32Array(N * N * 3), nor = new Float32Array(N * N * 3), col = new Float32Array(N * N * 3);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const idx = i * N + j, h = hAt(i, j);
    const nx = (hAt(i - 1, j) - hAt(i + 1, j)) / (2 * cs), nz = (hAt(i, j - 1) - hAt(i, j + 1)) / (2 * cs);
    const len = Math.hypot(nx, 1, nz);
    pos[idx * 3] = i * cs; pos[idx * 3 + 1] = h; pos[idx * 3 + 2] = j * cs;
    nor[idx * 3] = nx / len; nor[idx * 3 + 1] = 1 / len; nor[idx * 3 + 2] = nz / len;
    groundColor(ox + i * cs, oz + j * cs, h, 1 / len, tmpColor);
    tmpColor.toArray(col, idx * 3);
  }
  const idxArr = new Uint16Array(SEG * SEG * 6);
  let q = 0;
  for (let i = 0; i < SEG; i++) for (let j = 0; j < SEG; j++) {
    const a = i * N + j, b = i * N + j + 1, c = (i + 1) * N + j, d = (i + 1) * N + j + 1;
    idxArr[q++] = a; idxArr[q++] = b; idxArr[q++] = c;
    idxArr[q++] = b; idxArr[q++] = d; idxArr[q++] = c;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setIndex(new THREE.BufferAttribute(idxArr, 1));
  const terrain = new THREE.Mesh(geo, terrainMat);
  terrain.position.set(ox, 0, oz);
  group.add(terrain);

  // --- 地面の高さ・傾き (メッシュと同じ三角形で補間。結果の法線は _gn) ---
  const ground = (lx, lz) => {
    const fi = lx / cs, fj = lz / cs;
    const i = Math.min(SEG - 1, Math.max(0, Math.floor(fi))), j = Math.min(SEG - 1, Math.max(0, Math.floor(fj)));
    const fx = fi - i, fz = fj - j;
    const ha = hAt(i, j), hb = hAt(i, j + 1), hc = hAt(i + 1, j), hd = hAt(i + 1, j + 1);
    let y, gx, gz;
    if (fx + fz <= 1) { y = ha + (hc - ha) * fx + (hb - ha) * fz; gx = (hc - ha) / cs; gz = (hb - ha) / cs; }
    else { y = hd + (hb - hd) * (1 - fx) + (hc - hd) * (1 - fz); gx = (hd - hb) / cs; gz = (hd - hc) / cs; }
    _gn.set(-gx, 1, -gz).normalize();
    return y;
  };

  const rng = mulberry32(Math.imul(cx, 73856093) ^ Math.imul(cz, 19349663) ^ seed);
  const desert = TH.shape === 'desert';
  const sd = TH.sunDirV;
  const shadows = [];
  const addShadow = (x, y, z, size) => {
    _q.setFromUnitVectors(UP, _gn);
    shadows.push({ x: x - sd.x * size * 0.22, y: y + 0.07, z: z - sd.z * size * 0.22, s: size, q: _q.clone() });
  };

  // --- 木・サボテン ---
  const trees = [];
  for (let n = 0; n < TH.trees; n++) {
    const lx = rng() * CHUNK, lz = rng() * CHUNK;
    const s = 0.8 + rng() * 0.9, ry = rng() * Math.PI * 2, r1 = rng(), ci = rng();
    if (Math.abs(ox + lx - pathX(oz + lz)) < 5) continue;
    const y = ground(lx, lz);
    if (_gn.y < 0.72) continue;
    const pine = desert || r1 < TH.pineRatio;
    trees.push({ x: ox + lx, y, z: oz + lz, s, ry, pine, ci });
    addShadow(ox + lx, y, oz + lz, (pine ? 3.6 : 5.0) * s);
  }
  const pines = trees.filter(t => t.pine), leafs = trees.filter(t => !t.pine);
  const pineCols = TH.pine.map(c => new THREE.Color(c)), leafCols = TH.leaf.map(c => new THREE.Color(c));
  const meshes = [];
  if (!desert) meshes.push(instanced(trunkGeo, trunkMat, trees));
  meshes.push(instanced(desert ? cactusGeo : pineGeo, foliageMat, pines, pineCols));
  if (!desert) meshes.push(instanced(leafGeo, foliageMat, leafs, leafCols));

  // --- 岩 ---
  const rocks = [];
  const rockBase = new THREE.Color(G.rock);
  const rockCols = [rockBase.clone(), rockBase.clone().multiplyScalar(1.25), rockBase.clone().multiplyScalar(0.8)];
  for (let n = 0; n < TH.rocks; n++) {
    const lx = rng() * CHUNK, lz = rng() * CHUNK, s = (desert ? 0.9 : 0.4) + rng() * (desert ? 1.8 : 1.1);
    const ry = rng() * Math.PI * 2, ci = rng();
    if (Math.abs(ox + lx - pathX(oz + lz)) < 3.5) continue;
    const y = ground(lx, lz);
    rocks.push({ x: ox + lx, y: y - 0.12 * s, z: oz + lz, s, ry, ci });
    addShadow(ox + lx, y, oz + lz, 2.6 * s);
  }
  // --- 道の上の出来事 (穴・水たまり・落とし物) ---
  const potholes = [], puddles = [];
  const itemLists = { cone: [], box: [], pack: [], wallet: [] };
  if (eventsOn) {
    const k0 = Math.floor((oz - 6) / SLOT), k1 = Math.ceil((oz + CHUNK + 6) / SLOT);
    for (let k = k0; k <= k1; k++) {
      const h = hash2(k, 1234);
      if (h < 0.28) continue;                                   // 何もない区間
      const zc = k * SLOT + (hash2(k, 31) - 0.5) * 10;
      if (Math.abs(zc) < 8) continue;                           // スタート地点のそばは空ける
      const xc = pathX(zc) + (hash2(k, 77) - 0.5) * 3.4;
      const lx = xc - ox, lz = zc - oz;
      if (lx < 0 || lx >= CHUNK || lz < 0 || lz >= CHUNK) continue;
      const y = ground(lx, lz);
      const tilt = new THREE.Quaternion().setFromUnitVectors(UP, _gn);
      const yaw = hash2(k, 5) * 6.28, ci = hash2(k, 9), sa = hash2(k, 13), sb = hash2(k, 14);
      const decalQ = tilt.clone().multiply(new THREE.Quaternion().setFromAxisAngle(UP, yaw));
      if (h < 0.46 || (h < 0.6 && desert)) {                    // 穴 (縁に小石)
        const s = 1.5 + sa * 0.9;
        potholes.push({ x: xc, y: y + 0.06, z: zc, sx: s, sy: 1, sz: s * (0.8 + sb * 0.4), q: decalQ });
        for (let n = 0; n < 6; n++) {
          const a = n / 6 * 6.28 + sb * 3, R = 0.62 * s;
          rocks.push({ x: xc + Math.cos(a) * R, y: y - 0.02, z: zc + Math.sin(a) * R, s: 0.12 + hash2(k, 40 + n) * 0.14, ry: a, ci: hash2(k, 60 + n) });
        }
      } else if (h < 0.6) {                                     // 水たまり
        const s = 2 + sa * 1.6;
        puddles.push({ x: xc, y: y + 0.05, z: zc, sx: s, sy: 1, sz: s * (0.55 + sb * 0.25), q: decalQ });
      } else {                                                  // 落とし物
        const r2 = hash2(k, 55);
        if (r2 < 0.3) {
          const fallen = ci < 0.45;
          itemLists.cone.push({ x: xc, y: fallen ? y + 0.12 : y, z: zc, s: 1, ry: yaw, rz: fallen ? 1.45 : 0, ci });
        } else if (r2 < 0.55) itemLists.box.push({ x: xc, y, z: zc, s: 1, ry: yaw, ci });
        else if (r2 < 0.8) itemLists.pack.push({ x: xc, y: y + 0.08, z: zc, s: 1, ry: yaw, rz: 1.2, ci });
        else itemLists.wallet.push({ x: xc, y: y + 0.02, z: zc, s: 1.6, ry: yaw, ci });
        addShadow(xc, y, zc, 1.3);
      }
    }
  }
  const pm = instanced(potholeGeoFlat, potholeMat, potholes); pm.renderOrder = 1; meshes.push(pm);
  const um = instanced(potholeGeoFlat, puddleMat, puddles); um.renderOrder = 1; meshes.push(um);
  for (const kind of ['cone', 'box', 'pack', 'wallet'])
    if (itemLists[kind].length) meshes.push(instanced(itemGeos[kind], itemMat, itemLists[kind], ITEM_COLS[kind]));
  meshes.push(instanced(rockGeo, rockMat, rocks, rockCols));

  // --- 草・花 ---
  const grassItems = [], flowerItems = [];
  const gcfg = TH.grass, fcfg = TH.flowers;
  if (gcfg && GRASS_SCALE > 0) {
    const n = Math.floor(gcfg.n * GRASS_SCALE);
    for (let k = 0; k < n; k++) {
      const lx = rng() * CHUNK, lz = rng() * CHUNK, ry = rng() * 6.28, s = 0.7 + rng() * 0.9, ci = rng(), keep = rng();
      const wx = ox + lx, wz = oz + lz;
      if (Math.abs(wx - pathX(wz)) < 3.3) continue;
      if (keep > 0.25 + fbm(wx * 0.06, wz * 0.06, 2) * 1.3) continue;   // 草むらに濃淡をつける
      const y = ground(lx, lz);
      if (_gn.y < 0.8 || y > G.h2) continue;
      grassItems.push({ x: wx, y, z: wz, s, ry, ci });
    }
  }
  if (fcfg && GRASS_SCALE > 0) {
    for (let k = 0; k < fcfg.n; k++) {
      const lx = rng() * CHUNK, lz = rng() * CHUNK, ci = rng(), s = 0.8 + rng() * 0.6;
      const wx = ox + lx, wz = oz + lz;
      if (Math.abs(wx - pathX(wz)) < 3.5) continue;
      if (fbm(wx * 0.05 + 9, wz * 0.05 + 9, 2) < 0.45) continue;        // 花畑のかたまり
      const y = ground(lx, lz);
      if (_gn.y < 0.85 || y > G.h2) continue;
      flowerItems.push({ x: wx, y, z: wz, s, ry: 0, ci });
    }
  }
  if (gcfg) meshes.push(instanced(grassGeo, grassMat, grassItems, gcfg.colors.map(c => new THREE.Color(c))));
  if (fcfg) meshes.push(instanced(flowerGeo, flowerMat, flowerItems, fcfg.colors.map(c => new THREE.Color(c))));

  // --- 木や岩の足元のやわらかい影 ---
  const shadowM = instanced(shadowGeo, shadowMat, shadows);
  shadowM.renderOrder = 1;
  meshes.push(shadowM);

  meshes.forEach(m => group.add(m));
  scene.add(group);
  return { group, terrain, insts: meshes };
}

function disposeChunk(c) {
  scene.remove(c.group);
  c.terrain.geometry.dispose();
  c.insts.forEach(m => m.dispose());
}

// 新しいチャンクは1フレームに1つずつ作る (VRでのカクつき防止)
let lastCX = null, lastCZ = null;
function syncChunks(force = false) {
  const cx = Math.floor(dolly.position.x / CHUNK);
  const cz = Math.floor(dolly.position.z / CHUNK);
  if (!force && cx === lastCX && cz === lastCZ) return;
  lastCX = cx; lastCZ = cz;
  const need = new Set(), missing = [];
  for (let dx = -RADIUS; dx <= RADIUS; dx++)
    for (let dz = -RADIUS; dz <= RADIUS; dz++) {
      const key = `${cx + dx},${cz + dz}`;
      need.add(key);
      if (!chunks.has(key)) missing.push({ key, cx: cx + dx, cz: cz + dz, d: dx * dx + dz * dz });
    }
  for (const [key, c] of chunks) {
    if (!need.has(key)) { disposeChunk(c); chunks.delete(key); }
  }
  missing.sort((a, b) => a.d - b.d);
  queue.length = 0;
  queue.push(...missing);
}
function pump(n) {
  while (n-- > 0 && queue.length) {
    const m = queue.shift();
    if (!chunks.has(m.key)) chunks.set(m.key, buildChunk(m.cx, m.cz));
  }
}

/* ========== 雲 (やわらかい板ポリ) ========== */
const clouds = new THREE.Group();
const cloudMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.9, depthWrite: false, fog: false });
const cr = mulberry32(seed + 999);
for (let i = 0; i < 12; i++) {
  const bx = (cr() - 0.5) * 320, by = 55 + cr() * 30, bz = (cr() - 0.5) * 320;
  for (let k = 0; k < 4; k++) {
    const s = new THREE.Sprite(cloudMat);
    s.position.set(bx + (cr() - 0.5) * 40, by + (cr() - 0.5) * 6, bz + (cr() - 0.5) * 20);
    s.scale.set(50 + cr() * 40, 20 + cr() * 10, 1);
    clouds.add(s);
  }
}

/* ========== 舞う粒子 (落ち葉・花びら・雪) ========== */
const P_MAX = 400;
const pPos = new Float32Array(P_MAX * 3);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ size: 0.2, map: dotTex, transparent: true, opacity: 0.9, depthWrite: false });
const points = new THREE.Points(pGeo, pMat);
points.frustumCulled = false;
scene.add(points);

function resetParticles() {
  const pr = mulberry32(seed + 7);
  for (let i = 0; i < P_MAX; i++) {
    pPos[i * 3]     = dolly.position.x + (pr() - 0.5) * 50;
    pPos[i * 3 + 1] = dolly.position.y + pr() * 20 - 2;
    pPos[i * 3 + 2] = dolly.position.z + (pr() - 0.5) * 50;
  }
  pGeo.attributes.position.needsUpdate = true;
}
function updateParticles(dt, time) {
  const P = TH.particles;
  if (!P) return;
  const px = dolly.position.x, py = dolly.position.y, pz = dolly.position.z;
  for (let i = 0; i < P.count; i++) {
    let x = pPos[i * 3], y = pPos[i * 3 + 1], z = pPos[i * 3 + 2];
    y -= P.fall * dt;
    x += Math.sin(time * 0.8 + i) * P.drift * dt;
    z += Math.cos(time * 0.6 + i * 1.7) * P.drift * 0.6 * dt;
    if (y < py - 2) y += 22;
    if (x - px > 25) x -= 50; else if (x - px < -25) x += 50;
    if (z - pz > 25) z -= 50; else if (z - pz < -25) z += 50;
    pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  }
  pGeo.attributes.position.needsUpdate = true;
}

/* ========== テーマ切り替え ========== */
const statusEl = document.getElementById('status');
const themesEl = document.getElementById('themes');
THEME_KEYS.forEach(k => {
  const b = document.createElement('button');
  b.textContent = THEMES[k].label;
  b.dataset.key = k;
  b.addEventListener('click', () => applyTheme(k));
  themesEl.appendChild(b);
  THEMES[k].sunDirV = new THREE.Vector3(...THEMES[k].sunDir).normalize();
});

function applyTheme(key, instant = false) {
  themeKey = key; TH = THEMES[key];
  // 空・霧・光
  skyUniforms.top.value.set(TH.skyTop);
  skyUniforms.horizon.value.set(TH.skyHorizon);
  skyUniforms.sunColor.value.set(TH.sunColor);
  skyUniforms.sunDir.value.copy(TH.sunDirV);
  scene.background.set(TH.skyHorizon);
  scene.fog.color.set(TH.skyHorizon); scene.fog.near = TH.fog[0]; scene.fog.far = TH.fog[1];
  hemi.color.set(TH.hemi[0]); hemi.groundColor.set(TH.hemi[1]); hemi.intensity = TH.hemi[2] * 1.3;
  sun.color.set(TH.sun[0]); sun.intensity = TH.sun[1];
  sun.position.copy(TH.sunDirV).multiplyScalar(100);
  cloudMat.color.set(TH.cloud);
  puddleMat.color.set(TH.skyTop).lerp(new THREE.Color(TH.skyHorizon), 0.12).multiplyScalar(1.15);
  trunkMat.color.set(TH.trunk);

  // 地形と木を作り直す (足元の近くを先に作る)
  for (const c of chunks.values()) disposeChunk(c);
  chunks.clear();
  dolly.position.y = heightAt(dolly.position.x, dolly.position.z);
  syncChunks(true);
  pump(instant ? 25 : 9);

  // 粒子
  if (TH.particles) {
    pMat.color.set(TH.particles.color);
    pMat.size = TH.particles.size;
    pGeo.setDrawRange(0, TH.particles.count);
    resetParticles();
  }
  points.visible = !!TH.particles;

  themesEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  const url = new URL(location.href);
  url.searchParams.set('theme', key);
  history.replaceState(null, '', url);
}
const nextTheme = () => applyTheme(THEME_KEYS[(THEME_KEYS.indexOf(themeKey) + 1) % THEME_KEYS.length]);

// VR: コントローラーのグリップ(握るボタン)でテーマ切り替え
for (let i = 0; i < 2; i++) {
  const ctrl = renderer.xr.getController(i);
  ctrl.addEventListener('squeezestart', nextTheme);
  dolly.add(ctrl);
}

/* ========== 歩行者 (向こうから歩いてくる人) ========== */
const NPC_MAX = 4;
const npcs = [];
let npcTimer = 12;
const _nf = new THREE.Vector3();
const NPC_SKIN  = [0xf0c8a0, 0xd9a577, 0xb98055, 0x8a5a3c];
const NPC_SHIRT = [0x3a6ea5, 0xc04a3a, 0x4a9a5a, 0xe0b040, 0x8a5aa8, 0x2a2a2a, 0xe8e8e8, 0xd0703a];
const NPC_PANTS = [0x2a2f3a, 0x4a3a2a, 0x3a4a5a, 0x5a5a5a, 0x1e2a44];
const NPC_HAIR  = [0x1a1410, 0x3a2a1a, 0x6a4a2a, 0xb8a070, 0x8a8a8a];
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const npcGeo = {
  torso: new THREE.CapsuleGeometry(0.19, 0.3, 3, 8).scale(1, 1, 0.65).translate(0, 1.2, 0),
  head: new THREE.IcosahedronGeometry(0.13, 1).translate(0, 1.68, 0),
  hair: new THREE.SphereGeometry(0.14, 8, 5, 0, Math.PI * 2, 0, Math.PI * 0.55).translate(0, 1.70, -0.01),
  arm: new THREE.CapsuleGeometry(0.055, 0.5, 3, 6).translate(0, -0.305, 0),
  leg: new THREE.CapsuleGeometry(0.08, 0.72, 3, 6).translate(0, -0.44, 0),
};
function makeNPC() {
  const g = new THREE.Group();
  const mk = c => new THREE.MeshLambertMaterial({ color: c });
  const skin = mk(pick(NPC_SKIN)), shirt = mk(pick(NPC_SHIRT)), pants = mk(pick(NPC_PANTS)), hair = mk(pick(NPC_HAIR));
  const add = (geo, mat, parent = g) => { const m = new THREE.Mesh(geo, mat); parent.add(m); return m; };
  add(npcGeo.torso, shirt); add(npcGeo.head, skin); add(npcGeo.hair, hair);
  const pivot = (x, y, geo, mat) => { const p = new THREE.Group(); p.position.set(x, y, 0); g.add(p); add(geo, mat, p); return p; };
  const n = {
    g, mats: [skin, shirt, pants, hair],
    legL: pivot(-0.1, 0.92, npcGeo.leg, pants), legR: pivot(0.1, 0.92, npcGeo.leg, pants),
    armL: pivot(-0.25, 1.42, npcGeo.arm, shirt), armR: pivot(0.25, 1.42, npcGeo.arm, shirt),
  };
  const sh = new THREE.Mesh(shadowGeo, shadowMat); sh.scale.set(1.1, 1, 1.1); sh.position.y = 0.06; sh.renderOrder = 1; g.add(sh);
  g.scale.setScalar(0.92 + Math.random() * 0.16);
  return n;
}
function updateNPC(n, dt) {
  n.z += n.vz * dt;
  const x = pathX(n.z) + n.lat, y = heightAt(x, n.z), sgn = Math.sign(n.vz);
  n.phase += n.speed * dt * 4.5;
  const sw = Math.sin(n.phase) * 0.55;
  n.legL.rotation.x = sw; n.legR.rotation.x = -sw; n.armL.rotation.x = -sw * 0.8; n.armR.rotation.x = sw * 0.8;
  n.g.position.set(x, y + Math.abs(Math.cos(n.phase)) * 0.02, n.z);
  n.g.rotation.y = Math.atan2(pathX(n.z + sgn) - pathX(n.z), sgn);   // 道に沿って進行方向を向く
}
function spawnNPC(dist = 60, sign = null) {
  if (!npcOn || npcs.length >= NPC_MAX) return;
  if (sign === null) { camera.getWorldDirection(_nf); sign = _nf.z <= 0 ? -1 : 1; }
  const n = makeNPC(), speed = 1.1 + Math.random() * 0.5;
  n.z = dolly.position.z + sign * dist; n.vz = -sign * speed; n.speed = speed;
  n.lat = (Math.random() < 0.5 ? -1 : 1) * (0.7 + Math.random() * 1.0); n.phase = Math.random() * 6.28;
  scene.add(n.g); npcs.push(n); updateNPC(n, 0);
}
function removeNPC(i) {
  const n = npcs[i]; scene.remove(n.g); n.mats.forEach(m => m.dispose()); npcs.splice(i, 1);
}
function updateNPCs(dt) {
  if (!npcOn) return;
  npcTimer -= dt;
  if (npcTimer <= 0) { spawnNPC(); npcTimer = 10 + Math.random() * 15; }
  for (let i = npcs.length - 1; i >= 0; i--) {
    const n = npcs[i];
    updateNPC(n, dt);
    const passed = (n.z - dolly.position.z) * Math.sign(n.vz);
    if (passed > 40 || Math.abs(n.z - dolly.position.z) > 130) removeNPC(i);
  }
}
function syncNPCs() {
  if (!npcOn) { for (let i = npcs.length - 1; i >= 0; i--) removeNPC(i); }
  else if (npcs.length === 0) { spawnNPC(35); spawnNPC(70); npcTimer = 12; }
}

// ON/OFF切り替え (研究で「なし」の条件にも使えます)
const tgNpc = document.getElementById('tgNpc'), tgEvt = document.getElementById('tgEvt');
function syncToggles() {
  tgNpc.textContent = '歩行者 ' + (npcOn ? 'ON' : 'OFF'); tgNpc.classList.toggle('on', npcOn);
  tgEvt.textContent = '落とし物・穴 ' + (eventsOn ? 'ON' : 'OFF'); tgEvt.classList.toggle('on', eventsOn);
  const url = new URL(location.href);
  url.searchParams.set('npc', npcOn ? '1' : '0'); url.searchParams.set('events', eventsOn ? '1' : '0');
  history.replaceState(null, '', url);
}
const toggleNpc = () => { npcOn = !npcOn; syncNPCs(); syncToggles(); };
const toggleEvents = () => { eventsOn = !eventsOn; syncToggles(); applyTheme(themeKey); };
tgNpc.addEventListener('click', toggleNpc);
tgEvt.addEventListener('click', toggleEvents);

/* ========== 入力 (PC確認用) ========== */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyH') { const p = document.getElementById('panel'); p.style.display = p.style.display === 'none' ? '' : 'none'; }
  if (e.code === 'KeyT') nextTheme();
  if (e.code === 'KeyN') toggleNpc();
  if (e.code === 'KeyE') toggleEvents();
  if (e.code === 'BracketLeft')  speedMult = Math.max(0.25, speedMult - 0.25);
  if (e.code === 'BracketRight') speedMult = Math.min(4, speedMult + 0.25);
  const m = /^Digit([1-9])$/.exec(e.code);
  if (m && THEME_KEYS[+m[1] - 1]) applyTheme(THEME_KEYS[+m[1] - 1]);
});
addEventListener('keyup', e => { keys[e.code] = false; });
let dragging = false;
renderer.domElement.addEventListener('pointerdown', () => { dragging = true; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging || renderer.xr.isPresenting) return;
  camera.rotation.y -= e.movementX * 0.005;
  camera.rotation.x = Math.max(-1.2, Math.min(1.2, camera.rotation.x - e.movementY * 0.005));
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ========== メインループ ========== */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3();
let prevHeadY = null, bob = 0, statusTimer = 0, elapsed = 0;

applyTheme(themeKey, true);
syncToggles();
if (npcOn) { spawnNPC(35, -1); spawnNPC(70, -1); }

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;
  let speed = 0;

  if (renderer.xr.isPresenting) {
    // 足踏み検出: 頭の上下方向の速さ(平滑化)が一定以上なら「歩いている」とみなす
    const y = camera.position.y;
    if (prevHeadY !== null && dt > 0) {
      const vy = Math.abs((y - prevHeadY) / dt);
      bob += (vy - bob) * (1 - Math.exp(-dt * 6));
    }
    prevHeadY = y;
    speed = Math.min(MAX_SPEED, Math.max(0, bob - STEP_THRESHOLD) * STEP_GAIN);
  } else {
    prevHeadY = null; bob = 0;
    if (keys['KeyW']) speed = 3;
    if (keys['KeyS']) speed = -2;
  }
  speed *= speedMult;

  if (speed !== 0) {
    camera.getWorldDirection(fwd);
    fwd.y = 0;
    if (fwd.lengthSq() > 1e-6) {
      fwd.normalize();
      dolly.position.addScaledVector(fwd, speed * dt);
    }
  }

  // 地形に高さを合わせる
  const targetY = heightAt(dolly.position.x, dolly.position.z);
  dolly.position.y += (targetY - dolly.position.y) * Math.min(1, dt * 8);

  syncChunks();
  pump(1);
  updateParticles(dt, elapsed);
  updateNPCs(dt);
  clouds.position.set(dolly.position.x, 0, dolly.position.z);
  clouds.rotation.y += dt * 0.004;

  statusTimer += dt;
  if (statusTimer > 0.3 && !renderer.xr.isPresenting) {
    statusTimer = 0;
    statusEl.textContent = `テーマ: ${TH.label} / シード: ${seed} / 速度倍率: ×${speedMult.toFixed(2)}`;
  }

  renderer.render(scene, camera);
});
</script>
</body>
