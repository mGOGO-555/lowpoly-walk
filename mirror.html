<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror Arm - Phase 1B</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #202428; font-family: sans-serif; }
  #panel {
    position: fixed; top: 12px; left: 12px; padding: 10px 14px; border-radius: 10px;
    background: rgba(20, 20, 26, 0.75); color: #eee; font-size: 12px; line-height: 1.6; white-space: pre;
  }
</style>
</head>
<body>
<div id="panel">Mirror Arm - Phase 1B (right arm)
Quest Browser で「ENTER VR」を押してください。</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* ========== CONFIG ==========
   身体寸法は「一般的な値の仮置き」で、参加者の実測値ではありません。
   URLで一時的に変更できます: ?sw=0.36&vo=0.22&po=0.08&ua=0.30&fa=0.27 (単位 m) */
const qs = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const CONFIG = {
  jointMinRadius: 0.004,
  // --- 身体寸法 (ESTIMATED用の仮置き値) ---
  shoulderWidth: num('sw', 0.36),                    // 左右の肩の間隔
  headToShoulderVerticalOffset: num('vo', 0.22),     // 頭(両眼中間)から肩までの下方向の距離
  headToShoulderPosteriorOffset: num('po', 0.08),    // 頭から肩までの後方向の距離
  headToNeckDown: num('hd', 0.08),                   // 頭(両眼中間)から首の回転軸までの下方向 (仮置き)
  headToNeckBack: num('hb', 0.09),                   // 頭(両眼中間)から首の回転軸までの後方向 (仮置き)
  upperArmLength: num('ua', 0.30),
  forearmLength: num('fa', 0.27),                    // 肘〜手首
  // --- 肘の曲がる向き (身体座標: 右+, 上+, 前+)。外側・下・やや後方 ---
  elbowPoleBody: { right: 0.5, up: -0.8, forward: -0.3 },
  bodyYawSmoothingSec: 0.25,                         // 身体向き(yaw)の平滑化
  bodyYawFollowLimitRad: num('yl', 50) * Math.PI / 180,  // 頭が体幹に対してこの角度までは体幹は動かない (首振り想定)。?yl=0 で頭に完全追従
  ikReachMargin: 0.999,
  ikBendSmoothingSec: 0.05,                          // 肘の向きの連続性 (急な切り替え防止)
  // --- 表示色 ---
  colorTracked: 0x4fc3f7,     // TRACKED = 青
  colorTrackedBone: 0x2a8fc8,
  colorEstimated: 0xffa040,   // ESTIMATED = オレンジ
  colorMirrored: 0x66dd77,    // MIRRORED / GENERATED = 緑
  colorMirroredBone: 0x3aa64a,
  // --- 環境 (Phase 2): セッション開始時の身体の前方に配置 ---
  deskForward: num('dd', 0.45),                      // 肩の中央から机の中心までの前方距離
  deskTopBelowShoulder: num('dh', 0.30),             // 机の上面は肩よりこの分だけ下
  deskWidth: 1.0, deskDepth: 0.5, deskThickness: 0.04,
  cubeSize: 0.05,                                    // cubeの一辺 (m)
  cubeLocalX: -0.18,                                 // 机中心から左方向 (仮想左手の側)
  cubeLocalZ: 0.07,                                  // 机中心より手前
  colorCube: 0xe53935,
};

/* ========== WebXR Hand Input の25関節 ========== */
const FINGERS = {
  thumb: ['metacarpal', 'phalanx-proximal', 'phalanx-distal', 'tip'],
  'index-finger': ['metacarpal', 'phalanx-proximal', 'phalanx-intermediate', 'phalanx-distal', 'tip'],
  'middle-finger': ['metacarpal', 'phalanx-proximal', 'phalanx-intermediate', 'phalanx-distal', 'tip'],
  'ring-finger': ['metacarpal', 'phalanx-proximal', 'phalanx-intermediate', 'phalanx-distal', 'tip'],
  'pinky-finger': ['metacarpal', 'phalanx-proximal', 'phalanx-intermediate', 'phalanx-distal', 'tip'],
};
const JOINT_NAMES = ['wrist'];
const BONE_PAIRS = [];
for (const [finger, parts] of Object.entries(FINGERS)) {
  let prev = 'wrist';
  for (const p of parts) {
    const name = `${finger}-${p}`;
    JOINT_NAMES.push(name);
    BONE_PAIRS.push([prev, name]);
    prev = name;
  }
}

/* ==========================================================
   TRACKED: WebXRから直接取得した実測値のみ
   ========================================================== */
const tracked = {
  headPoseValid: false,
  headPosition: new THREE.Vector3(),
  headQuaternion: new THREE.Quaternion(),
  rightHandTracking: false,
  rightWristTracked: false,
  trackedJointCount: 0,
  rightHandJoints: JOINT_NAMES.map(name => ({ name, tracked: false, position: new THREE.Vector3(), radius: 0 })),
};
function clearTracked() {
  tracked.headPoseValid = false;
  tracked.rightHandTracking = false;
  tracked.rightWristTracked = false;
  tracked.trackedJointCount = 0;
  for (const j of tracked.rightHandJoints) j.tracked = false;
}
const finite3 = p => Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z);

function updateTracked(frame) {
  clearTracked();
  const session = renderer.xr.getSession && renderer.xr.getSession();
  const ref = renderer.xr.getReferenceSpace && renderer.xr.getReferenceSpace();
  if (!frame || !session || !ref) return;

  // HMD pose (viewer pose)
  const vp = frame.getViewerPose(ref);
  if (vp) {
    const p = vp.transform.position, o = vp.transform.orientation;
    if (finite3(p) && [o.x, o.y, o.z, o.w].every(Number.isFinite)) {
      tracked.headPosition.set(p.x, p.y, p.z);
      tracked.headQuaternion.set(o.x, o.y, o.z, o.w);
      tracked.headPoseValid = true;
    }
  }

  // 右手のみ (左手は使用しない)
  let hand = null;
  for (const src of session.inputSources) {
    if (src.handedness === 'right' && src.hand) { hand = src.hand; break; }
  }
  if (!hand) return;
  tracked.rightHandTracking = true;
  for (let i = 0; i < JOINT_NAMES.length; i++) {
    const js = hand.get(JOINT_NAMES[i]);
    const pose = js ? frame.getJointPose(js, ref) : null;
    const j = tracked.rightHandJoints[i];
    if (!pose) continue;
    const p = pose.transform.position;
    if (!finite3(p)) continue;
    j.position.set(p.x, p.y, p.z);
    j.radius = pose.radius || 0;
    j.tracked = true;
    tracked.trackedJointCount++;
  }
  tracked.rightWristTracked = tracked.rightHandJoints[0].tracked;
  if (tracked.trackedJointCount === 0) tracked.rightHandTracking = false;
}

/* ==========================================================
   BodyReference: HMDのyawから身体座標系を推定 (ESTIMATED)
   pitch/rollは使わない。身体の左右軸=正中面の法線。
   ========================================================== */
const body = {
  valid: false,
  yaw: 0, yawInit: false,
  forward: new THREE.Vector3(0, 0, -1),
  right: new THREE.Vector3(1, 0, 0),
  up: new THREE.Vector3(0, 1, 0),
  shoulderCenter: new THREE.Vector3(),   // ESTIMATED
};
const _f = new THREE.Vector3(), _u = new THREE.Vector3(), _neck = new THREE.Vector3();
const wrapPi = a => Math.atan2(Math.sin(a), Math.cos(a));
function updateBody(dt) {
  if (!tracked.headPoseValid) { body.valid = false; return; }
  _f.set(0, 0, -1).applyQuaternion(tracked.headQuaternion);
  _u.set(0, 1, 0).applyQuaternion(tracked.headQuaternion);
  let fx = _f.x, fz = _f.z, hl = Math.hypot(fx, fz);
  if (hl < 0.35) {                       // 真上/真下を向いたときは頭のup方向で向きを取る
    const s = _f.y < 0 ? 1 : -1;
    fx = _u.x * s; fz = _u.z * s; hl = Math.hypot(fx, fz);
  }
  if (hl > 0.05) {
    const target = Math.atan2(fx, -fz);
    if (!body.yawInit) { body.yaw = target; body.yawInit = true; }
    else {
      const delta = wrapPi(target - body.yaw), lim = CONFIG.bodyYawFollowLimitRad;
      const excess = delta - Math.max(-lim, Math.min(lim, delta));   // 限界を超えた分だけ体幹が追従
      body.yaw = wrapPi(body.yaw + excess * (1 - Math.exp(-dt / CONFIG.bodyYawSmoothingSec)));
    }
  }
  body.forward.set(Math.sin(body.yaw), 0, -Math.cos(body.yaw));
  body.up.set(0, 1, 0);
  body.right.crossVectors(body.forward, body.up).normalize();
  // 首の回転軸(推定)を頭の姿勢から求め、そこから肩の中央を決める → 首を振っても肩(=正中面)が動かない
  _neck.set(0, -CONFIG.headToNeckDown, CONFIG.headToNeckBack).applyQuaternion(tracked.headQuaternion).add(tracked.headPosition);
  body.shoulderCenter.copy(_neck)
    .addScaledVector(body.up, -(CONFIG.headToShoulderVerticalOffset - CONFIG.headToNeckDown))
    .addScaledVector(body.forward, -(CONFIG.headToShoulderPosteriorOffset - CONFIG.headToNeckBack));
  body.valid = body.shoulderCenter.toArray().every(Number.isFinite);
}

/* ==========================================================
   ESTIMATED: 肩・肘 (実測値ではない)
   ========================================================== */
const estimated = {
  valid: false,
  rightShoulder: new THREE.Vector3(),
  rightElbow: new THREE.Vector3(),
  ikTarget: new THREE.Vector3(),      // 表示用IK目標 (trackedの手首は書き換えない)
  ikStatus: '--',
  reachDist: 0, reachMax: 0,
  prevBend: new THREE.Vector3(), hasPrevBend: false,
};
const _d = new THREE.Vector3(), _dir = new THREE.Vector3(), _pole = new THREE.Vector3();
const _pv = new THREE.Vector3(), _pp = new THREE.Vector3(), _P = new THREE.Vector3();

function estimateRightShoulder() {
  estimated.rightShoulder.copy(body.shoulderCenter).addScaledVector(body.right, CONFIG.shoulderWidth / 2);
}

// ArmIK: two-bone IK。肘の向きはpole(身体座標で指定)と前フレームの連続性で決める
function solveRightArmIK(dt) {
  const S = estimated.rightShoulder;
  const W = tracked.rightHandJoints[0].position;      // 読み取りのみ
  const L1 = CONFIG.upperArmLength, L2 = CONFIG.forearmLength;
  _d.subVectors(W, S);
  const dist = _d.length();
  estimated.reachDist = dist;
  estimated.reachMax = L1 + L2;
  if (!Number.isFinite(dist) || dist < 1e-6) { estimated.ikStatus = 'ERROR'; return false; }
  _dir.copy(_d).divideScalar(dist);

  const maxR = (L1 + L2) * CONFIG.ikReachMargin, minR = Math.abs(L1 - L2) + 0.01;
  let status = 'OK', t = dist;
  if (t > maxR) { t = maxR; status = 'CLAMPED'; }
  else if (t < minR) { t = minR; status = 'CLAMPED'; }
  estimated.ikTarget.copy(S).addScaledVector(_dir, t);

  const a = (L1 * L1 - L2 * L2 + t * t) / (2 * t);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  _P.copy(S).addScaledVector(_dir, a);

  const pb = CONFIG.elbowPoleBody;
  _pole.set(0, 0, 0)
    .addScaledVector(body.right, pb.right).addScaledVector(body.up, pb.up).addScaledVector(body.forward, pb.forward)
    .normalize();
  _pv.copy(_pole).addScaledVector(_dir, -_pole.dot(_dir));          // 腕の軸に直交する成分
  if (_pv.length() < 0.15) {                                        // poleが腕の軸とほぼ平行 → 前フレームの向きを使う
    if (estimated.hasPrevBend) _pv.copy(estimated.prevBend); else _pv.copy(body.right);
    _pv.addScaledVector(_dir, -_pv.dot(_dir));
  }
  if (_pv.lengthSq() < 1e-10) { estimated.ikStatus = 'ERROR'; return false; }
  _pv.normalize();
  if (estimated.hasPrevBend) {                                      // 連続性: 前フレームの向きへ滑らかに
    _pp.copy(estimated.prevBend).addScaledVector(_dir, -estimated.prevBend.dot(_dir));
    if (_pp.lengthSq() > 1e-6) {
      _pp.normalize();
      const k = 1 - Math.exp(-dt / CONFIG.ikBendSmoothingSec);
      _pv.lerpVectors(_pp, _pv, k);
      if (_pv.lengthSq() < 1e-6) _pv.copy(_pp);
      _pv.normalize();
    }
  }
  estimated.prevBend.copy(_pv); estimated.hasPrevBend = true;

  estimated.rightElbow.copy(_P).addScaledVector(_pv, h);
  if (!finite3(estimated.rightElbow) || !finite3(estimated.ikTarget)) { estimated.ikStatus = 'ERROR'; return false; }
  estimated.ikStatus = status;
  return true;
}

/* ==========================================================
   MirrorTransform: MIRRORED / GENERATED (実左手は使用しない)
   鏡映面 = 推定した正中面 (点: 肩の中央, 法線: 身体の左右軸)
   位置のみを反転し、向きは反転後の位置から再構成する。
   ========================================================== */
const mirrored = {
  valid: false,
  leftShoulder: new THREE.Vector3(),
  leftElbow: new THREE.Vector3(),
  leftWrist: new THREE.Vector3(),     // 右のIK目標(表示用手首)の鏡像
  leftHandJoints: JOINT_NAMES.map(name => ({ name, generated: false, position: new THREE.Vector3() })),
};
const _mr = new THREE.Vector3();
function mirrorPoint(src, out) {
  _mr.subVectors(src, body.shoulderCenter);
  const s = _mr.dot(body.right);
  return out.copy(src).addScaledVector(body.right, -2 * s);
}
function updateMirror() {
  mirrored.valid = false;
  for (const j of mirrored.leftHandJoints) j.generated = false;
  if (!estimated.valid || !body.valid) return;
  mirrorPoint(estimated.rightShoulder, mirrored.leftShoulder);
  mirrorPoint(estimated.rightElbow, mirrored.leftElbow);
  mirrorPoint(estimated.ikTarget, mirrored.leftWrist);
  const R = tracked.rightHandJoints;
  for (let i = 0; i < R.length; i++) {
    if (!R[i].tracked) continue;
    const L = mirrored.leftHandJoints[i];
    mirrorPoint(R[i].position, L.position);
    L.generated = finite3(L.position);
  }
  mirrored.valid = finite3(mirrored.leftShoulder) && finite3(mirrored.leftElbow) && finite3(mirrored.leftWrist);
}

/* ========== シーン ========== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 1.6, 0);
scene.add(camera);
{  // 床: 白〜薄いグレー
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xececec }));
  scene.add(floor);
}
scene.add(new THREE.HemisphereLight(0xffffff, 0x999999, 2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(0.5, 2, 0.8);
scene.add(dirLight);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

/* ========== ArmRenderer ========== */
// 右手の骨格 (TRACKED = 青)
const jointGeo = new THREE.SphereGeometry(1, 10, 8);
const jointMat = new THREE.MeshBasicMaterial({ color: CONFIG.colorTracked });
const jointMeshes = JOINT_NAMES.map(() => { const m = new THREE.Mesh(jointGeo, jointMat); m.visible = false; scene.add(m); return m; });
const boneIdx = BONE_PAIRS.map(([a, b]) => [JOINT_NAMES.indexOf(a), JOINT_NAMES.indexOf(b)]);
const bonePos = new Float32Array(boneIdx.length * 2 * 3);
const boneGeo = new THREE.BufferGeometry();
boneGeo.setAttribute('position', new THREE.BufferAttribute(bonePos, 3));
const bones = new THREE.LineSegments(boneGeo, new THREE.LineBasicMaterial({ color: CONFIG.colorTrackedBone }));
bones.frustumCulled = false; bones.visible = false; scene.add(bones);

function renderRightHand() {
  const J = tracked.rightHandJoints;
  for (let i = 0; i < J.length; i++) {
    const m = jointMeshes[i];
    m.visible = J[i].tracked;
    if (J[i].tracked) { m.position.copy(J[i].position); m.scale.setScalar(Math.max(J[i].radius, CONFIG.jointMinRadius)); }
  }
  let n = 0;
  for (const [a, b] of boneIdx) {
    if (J[a].tracked && J[b].tracked) { J[a].position.toArray(bonePos, n * 3); n++; J[b].position.toArray(bonePos, n * 3); n++; }
  }
  boneGeo.setDrawRange(0, n);
  boneGeo.attributes.position.needsUpdate = true;
  bones.visible = n > 0;
}

// 右上肢 (ESTIMATED = オレンジ): 肩・肘の球、上腕・前腕の円柱
const estMat = new THREE.MeshLambertMaterial({ color: CONFIG.colorEstimated });
const shoulderMesh = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), estMat);
const elbowMesh = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), estMat);
const upperArmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1, 12), estMat);
const forearmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1, 12), estMat);
const armGroup = new THREE.Group();
armGroup.add(shoulderMesh, elbowMesh, upperArmMesh, forearmMesh);
armGroup.visible = false;
scene.add(armGroup);
const Y_AXIS = new THREE.Vector3(0, 1, 0), _bd = new THREE.Vector3();
function placeBone(mesh, A, B) {
  _bd.subVectors(B, A);
  const len = _bd.length();
  if (!(len > 1e-6)) { mesh.visible = false; return; }
  mesh.position.copy(A).addScaledVector(_bd, 0.5);
  mesh.quaternion.setFromUnitVectors(Y_AXIS, _bd.divideScalar(len));
  mesh.scale.set(1, len, 1);
  mesh.visible = true;
}
function renderRightArm() {
  armGroup.visible = estimated.valid;
  if (!estimated.valid) return;
  shoulderMesh.position.copy(estimated.rightShoulder);
  elbowMesh.position.copy(estimated.rightElbow);
  placeBone(upperArmMesh, estimated.rightShoulder, estimated.rightElbow);
  placeBone(forearmMesh, estimated.rightElbow, estimated.ikTarget);
}

// 仮想左上肢 (MIRRORED = 緑): 右と同じ構成
const mirMat = new THREE.MeshLambertMaterial({ color: CONFIG.colorMirrored });
const lShoulderMesh = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), mirMat);
const lElbowMesh = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), mirMat);
const lUpperArmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1, 12), mirMat);
const lForearmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1, 12), mirMat);
const leftArmGroup = new THREE.Group();
leftArmGroup.add(lShoulderMesh, lElbowMesh, lUpperArmMesh, lForearmMesh);
leftArmGroup.visible = false;
scene.add(leftArmGroup);
const lJointMat = new THREE.MeshBasicMaterial({ color: CONFIG.colorMirrored });
const lJointMeshes = JOINT_NAMES.map(() => { const m = new THREE.Mesh(jointGeo, lJointMat); m.visible = false; scene.add(m); return m; });
const lBonePos = new Float32Array(boneIdx.length * 2 * 3);
const lBoneGeo = new THREE.BufferGeometry();
lBoneGeo.setAttribute('position', new THREE.BufferAttribute(lBonePos, 3));
const lBones = new THREE.LineSegments(lBoneGeo, new THREE.LineBasicMaterial({ color: CONFIG.colorMirroredBone }));
lBones.frustumCulled = false; lBones.visible = false; scene.add(lBones);

function renderLeftArm() {
  leftArmGroup.visible = mirrored.valid;
  const L = mirrored.leftHandJoints;
  for (let i = 0; i < L.length; i++) {
    const m = lJointMeshes[i];
    m.visible = mirrored.valid && L[i].generated;
    if (m.visible) { m.position.copy(L[i].position); m.scale.setScalar(Math.max(tracked.rightHandJoints[i].radius, CONFIG.jointMinRadius)); }
  }
  let n = 0;
  if (mirrored.valid) {
    for (const [a, b] of boneIdx) {
      if (L[a].generated && L[b].generated) { L[a].position.toArray(lBonePos, n * 3); n++; L[b].position.toArray(lBonePos, n * 3); n++; }
    }
  }
  lBoneGeo.setDrawRange(0, n);
  lBoneGeo.attributes.position.needsUpdate = true;
  lBones.visible = n > 0;
  if (!mirrored.valid) return;
  lShoulderMesh.position.copy(mirrored.leftShoulder);
  lElbowMesh.position.copy(mirrored.leftElbow);
  placeBone(lUpperArmMesh, mirrored.leftShoulder, mirrored.leftElbow);
  placeBone(lForearmMesh, mirrored.leftElbow, mirrored.leftWrist);
}

/* ========== デバッグ表示 (DOM + VR内HUD) ========== */
function debugLines() {
  const mm = v => (v * 1000).toFixed(0);
  return [
    `Right hand tracking: ${tracked.rightHandTracking ? 'ON' : 'OFF'}`,
    `Right wrist tracked: ${tracked.rightWristTracked ? 'YES' : 'NO'}`,
    `Tracked hand joints: ${tracked.trackedJointCount} / 25`,
    'Right shoulder: ESTIMATED',
    'Right elbow: ESTIMATED',
    'Right wrist: TRACKED',
    `IK status: ${estimated.ikStatus}`,
    `Reach: ${mm(estimated.reachDist)} / ${mm(estimated.reachMax)} mm`,
    `Virtual left arm: ${mirrored.valid ? 'ON (MIRRORED)' : 'OFF'}`,
  ];
}
const hudCanvas = document.createElement('canvas');
hudCanvas.width = 512; hudCanvas.height = 336;
const hudG = hudCanvas.getContext('2d');
const hudTex = new THREE.CanvasTexture(hudCanvas);
hudTex.colorSpace = THREE.SRGBColorSpace;
const hudMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(0.4, 0.2625),
  new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, depthTest: false, depthWrite: false, toneMapped: false })
);
hudMesh.position.set(-0.3, -0.25, -0.9);
hudMesh.renderOrder = 999;
camera.add(hudMesh);

const panelEl = document.getElementById('panel');
let hudT = 0;
function updateDebug(dt) {
  hudT += dt;
  if (hudT < 0.2) return;
  hudT = 0;
  const lines = debugLines();
  panelEl.textContent = 'Mirror Arm - Phase 1C\n' + lines.join('\n');
  hudG.clearRect(0, 0, 512, 336);
  hudG.fillStyle = 'rgba(0,0,0,0.6)';
  hudG.fillRect(0, 0, 512, 336);
  hudG.font = 'bold 26px sans-serif';
  hudG.textBaseline = 'middle';
  lines.forEach((t, i) => {
    hudG.fillStyle = t.includes('MIRRORED') ? '#8be88b' : t.includes('ESTIMATED') ? '#ffb060' : t.includes('TRACKED') && !t.includes('Right hand') && !t.includes('Right wrist tracked') && !t.includes('Tracked hand') ? '#7fd4ff' : '#ffffff';
    hudG.fillText(t, 18, 26 + i * 34);
  });
  hudTex.needsUpdate = true;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ========== SceneSetup (Phase 2): 机とcube。セッション開始時の身体前方に一度だけ固定 ========== */
const env = { anchored: false, group: new THREE.Group(), legs: [], cube: null };
{
  const wood = new THREE.MeshLambertMaterial({ color: 0xbfa27a });
  const top = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.deskWidth, CONFIG.deskThickness, CONFIG.deskDepth), wood);
  top.position.y = -CONFIG.deskThickness / 2;         // 机の上面が group の y=0
  env.group.add(top);
  const legGeo = new THREE.BoxGeometry(0.04, 1, 0.04);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = new THREE.Mesh(legGeo, wood);
    leg.userData.sx = sx; leg.userData.sz = sz;
    env.group.add(leg); env.legs.push(leg);
  }
  env.cube = new THREE.Mesh(
    new THREE.BoxGeometry(CONFIG.cubeSize, CONFIG.cubeSize, CONFIG.cubeSize),
    new THREE.MeshLambertMaterial({ color: CONFIG.colorCube })
  );
  env.cube.position.set(CONFIG.cubeLocalX, CONFIG.cubeSize / 2, CONFIG.cubeLocalZ);
  env.group.add(env.cube);
  env.group.visible = false;
  scene.add(env.group);
}
function anchorEnvironment() {
  if (env.anchored || !body.valid) return;
  const topY = body.shoulderCenter.y - CONFIG.deskTopBelowShoulder;
  if (!(topY > 0.3)) return;                           // 異常値ガード
  env.group.position.set(
    body.shoulderCenter.x + body.forward.x * CONFIG.deskForward, topY,
    body.shoulderCenter.z + body.forward.z * CONFIG.deskForward);
  env.group.rotation.y = -body.yaw;
  const legH = topY - CONFIG.deskThickness;
  for (const leg of env.legs) {
    leg.scale.y = legH;
    leg.position.set(leg.userData.sx * (CONFIG.deskWidth / 2 - 0.04), -CONFIG.deskThickness - legH / 2, leg.userData.sz * (CONFIG.deskDepth / 2 - 0.04));
  }
  env.group.visible = true;
  env.anchored = true;
}
renderer.xr.addEventListener('sessionstart', () => { env.anchored = false; env.group.visible = false; body.yawInit = false; });

/* ========== メインループ ========== */
const clock = new THREE.Clock();
renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (renderer.xr.isPresenting) updateTracked(frame); else clearTracked();

  updateBody(dt);
  anchorEnvironment();
  estimated.valid = false;
  if (body.valid && tracked.rightWristTracked) {
    estimateRightShoulder();
    estimated.valid = solveRightArmIK(dt);
  } else {
    estimated.ikStatus = '--';
  }

  updateMirror();
  renderRightHand();
  renderRightArm();
  renderLeftArm();
  updateDebug(dt);
  renderer.render(scene, camera);
});
</script>
